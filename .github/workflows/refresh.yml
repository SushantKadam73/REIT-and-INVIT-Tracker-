name: Nightly data refresh

on:
  schedule:
    # 17:45 IST Mon–Fri = 12:15 UTC (IST is UTC+5:30, no DST)
    - cron: "15 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN || secrets.UPSTOX_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
           # poppler-utils provides pdftotext for PDF parsing; pdf-parse is the fallback.
      - name: Install PDF tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm install --no-save pdf-parse

      # Every step is allowed to fail without failing the job: the site serves
      # last-good committed data, and notify.mjs reports what went wrong.
      - name: Refresh EOD prices (Upstox Analytics token)
        continue-on-error: true
        run: node scripts/refresh-prices.mjs

      - name: Discover new trusts + distribution filings (NSE)
        continue-on-error: true
        run: node scripts/discover.mjs

      - name: Parse distribution PDFs
        continue-on-error: true
        run: node scripts/parse-distributions.mjs

      - name: Cross-check fundamentals (Upstox by ISIN)
        continue-on-error: true
        run: node scripts/fundamentals.mjs
      - name: Validate data
        continue-on-error: true
        run: node scripts/validate-data.mjs

      - name: Send alerts (if any)
        if: always()
        run: node scripts/notify.mjs

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not publish data that fails validation.
          node scripts/validate-data.mjs

          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore(data): nightly refresh $(date -u +%Y-%m-%d)"

          git fetch origin main

          if ! git rebase origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"

            # Only alerts can be automatically merged here.
                        # Conflicting financial data must never be silently overwritten.
            if [ "$conflicts" != "data/alerts.json" ]; then
              echo "::error::Rebase failed or financial data conflicts require review."
              printf '%s\n' "$conflicts"
              git rebase --abort
              exit 1
            fi

            if ! python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def read_stage(stage):
              raw = subprocess.check_output(
                  ["git", "show", f":{stage}:data/alerts.json"],
                  text=True,
              )
              value = json.loads(raw)
              if not isinstance(value, list):
                  raise ValueError("Expected alerts.json to contain an array")
              return value

                        merged = []
          seen = set()
          for alert in read_stage(2) + read_stage(3):
              key = json.dumps(alert, sort_keys=True, ensure_ascii=False)
              if key not in seen:
                  seen.add(key)
                  merged.append(alert)

          Path("data/alerts.json").write_text(
              json.dumps(merged, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
            then
              git rebase --abort
              exit 1
            fi

            git add data/alerts.json
            GIT_EDITOR=true git rebase --continue
          fi

          # Revalidate the combined result before publishing.
          node scripts/validate-data.mjs
          git push origin HEAD:main
